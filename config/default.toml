# Codegen fixes for SvR 2009's default.xex (included from svr2009_manifest.toml [entrypoint]).

# D3D Swap (sub_8225B850) just loaded the present interval (device+13596) into r11; logged.
[[midasm_hook]]
name = "SvrPresentIntervalHook"
address = 0x8225B900
registers = ["r11"]
after_instruction = true

# Frame-rate mode (src/fps_hooks.cpp): with --svr_60fps the game stays in its 60 fps mode.
# SetFrameRate(fps): r3 = requested rate; 30/25 become 60/50.
[[midasm_hook]]
name = "SvrSetFrameRateHook"
address = 0x82476F38
registers = ["r3"]

# "Drop to 30 fps mode": skipped (returns immediately) when the hook returns true.
[[midasm_hook]]
name = "SvrSkip30ModeHook"
address = 0x824771C0
registers = []
return_on_true = true

# The game's swap function (sub_8225BD40) about to call VdSwap: once per presented frame.
# src/fps_hooks.cpp counts frames for the on-screen FPS counter (F2).
[[midasm_hook]]
name = "SvrFrameSwapHook"
address = 0x8225BFA8
registers = []

# Loading: the loader's per-frame time slice (src/loading_hooks.cpp). At the budget compare in
# sub_82477A18, f13 = budget in ms (match loads set 1 ms); raised to svr_load_slice_ms.
[[midasm_hook]]
name = "SvrLoaderBudgetHook"
address = 0x82477A58
registers = ["f13"]

# Wide and tall screens (src/widescreen.cpp): the camera setup (sub_82483BD0) about to build the
# projection (bl sub_824836C0), f1 = field of view, f2 = aspect.
[[midasm_hook]]
name = "SvrCameraAspectHook"
address = 0x82483C20
registers = ["f1", "f2"]

[functions]
# Branch targets analysis left outside any function (codegen UnresolvedCall).
0x82792108 = {}
0x82769E30 = {}
0x827680A8 = {}
0x8273D87C = {}

# "Back to 60 fps mode" (sub_82477260): logged.
[[midasm_hook]]
name = "SvrBackTo60Hook"
address = 0x82477260
registers = []

# Cutscene captions (sub_822D4100) about to get the cutscene's time in f1, counted in frames:
# turned into 30 fps frames, which the captions are timed in (fps_hooks.cpp).
[[midasm_hook]]
name = "SvrCaptionTimeHook"
address = 0x822D4204
registers = ["f1"]

# Unlock everything (src/unlock_all.cpp): the check of item N (sub_8255E740) has just read the item's
# byte into r3 (r31 = the item).
[[midasm_hook]]
name = "SvrUnlockAllHook"
address = 0x8255E770
registers = ["r3", "r31"]
after_instruction = true

# The checks for one kind of thing: true jumps to where they answer "available". sub_8255E9B0, the
# superstars, past its check for downloaded ones.
[[midasm_hook]]
name = "SvrUnlockAllOn"
address = 0x8255EA14
jump_address_on_true = 0x8255EDC0

# sub_8255EDD8
[[midasm_hook]]
name = "SvrUnlockAllOn"
address = 0x8255EDE4
jump_address_on_true = 0x8255EDF4

# sub_8255EEE8
[[midasm_hook]]
name = "SvrUnlockAllOn"
address = 0x8255EEFC
jump_address_on_true = 0x8255EF3C

# sub_8255EF50
[[midasm_hook]]
name = "SvrUnlockAllOn"
address = 0x8255EF84
jump_address_on_true = 0x8255EFB8

# sub_8255EFD8
[[midasm_hook]]
name = "SvrUnlockAllOn"
address = 0x8255EFE8
jump_address_on_true = 0x8255F010
